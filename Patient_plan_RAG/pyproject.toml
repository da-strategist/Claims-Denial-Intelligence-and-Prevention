[project]
name = "patient-plan-rag"
version = "0.1.0"
description = "AI-Powered Health Insurance Coverage & Prior Authorization Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "numpy>=2.0.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
