name: rcm

profile: healthcarercm

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  rcm:
    +schema: raw

models:
  rcm:
    staging:
      +materialized: view
      +schema: staging
      dim_date:
        +materialized: table
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
