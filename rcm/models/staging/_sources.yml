version: 2

sources:
  - name: rcm_raw
    database: healthcarercm
    schema: rcm_data_raw
    description: >
      Raw seeded tables for the Claims Denial Intelligence Platform.
      All 25 tables loaded via dbt seed from the Data/raw_data directory.

    tables:

      # ---------------------------------------------------------------
      # DIMENSION TABLES
      # ---------------------------------------------------------------

      - name: dim_cpt_codes
        description: Reference table for CPT procedure codes with standard charges and billing metadata.
        columns:
          - name: cpt_code
            description: CPT procedure code (primary key).
            tests:
              - unique
              - not_null
          - name: description
            description: Human-readable description of the procedure.
          - name: category
            description: Procedure category grouping (e.g., E&M, Surgery, Radiology).
          - name: standard_charge
            description: Facility standard charge for this procedure.
          - name: primary_department
            description: Department most commonly performing this procedure.
          - name: billing_type
            description: Billing classification (e.g., professional, technical, global).

      - name: dim_departments
        description: Organizational departments within the facility, used to attribute claims and denials.
        columns:
          - name: department_id
            description: Unique department identifier (primary key).
            tests:
              - unique
              - not_null
          - name: department_name
            description: Name of the department.
          - name: service_line
            description: Service line the department belongs to (e.g., Cardiology, Oncology).
          - name: claim_share
            description: Proportion of total facility claims generated by this department.
          - name: pa_frequency
            description: Frequency at which prior authorizations are required for this department's services.
          - name: avg_daily_volume
            description: Average number of claims/encounters processed daily.

      - name: dim_facilities
        description: Facility-level reference data including type, size, and status.
        columns:
          - name: facility_id
            description: Unique facility identifier (primary key).
            tests:
              - unique
              - not_null
          - name: facility_name
            description: Name of the facility.
          - name: facility_type
            description: Type of facility (e.g., hospital, outpatient clinic, ASC).
          - name: bed_count
            description: Licensed bed capacity of the facility.
          - name: address
            description: Physical address of the facility.
          - name: status
            description: Operational status (e.g., active, inactive).
          - name: tax_id
            description: Federal tax identification number for billing purposes.

      - name: dim_icd10_codes
        description: ICD-10 diagnosis code reference table with clinical classification metadata.
        columns:
          - name: icd10_code
            description: ICD-10-CM diagnosis code (primary key).
            tests:
              - unique
              - not_null
          - name: description
            description: Clinical description of the diagnosis.
          - name: body_system
            description: Body system or organ system the diagnosis belongs to.
          - name: relative_frequency
            description: Relative frequency this code appears in the claims dataset.
          - name: acuity_type
            description: Clinical acuity classification (e.g., acute, chronic, preventive).

      - name: dim_patients
        description: Patient demographic and payer enrollment data.
        columns:
          - name: patient_id
            description: Unique patient identifier (primary key).
            tests:
              - unique
              - not_null
          - name: first_name
            description: Patient first name.
          - name: last_name
            description: Patient last name.
          - name: age
            description: Patient age at time of data generation.
          - name: gender
            description: Patient gender.
          - name: primary_payer_id
            description: Foreign key to dim_payers — patient's primary insurance payer.
          - name: risk_score
            description: Clinical risk score (e.g., HCC risk adjustment score).
          - name: zip_code
            description: Patient residential zip code.
          - name: language
            description: Patient preferred language.
          - name: status
            description: Patient status (e.g., active, discharged).

      - name: dim_payer_contracts
        description: Contracted reimbursement rates between the facility and payers by CPT category.
        columns:
          - name: contract_id
            description: Unique contract line identifier (primary key).
            tests:
              - unique
              - not_null
          - name: payer_id
            description: Foreign key to dim_payers.
          - name: cpt_category
            description: CPT category this contract rate applies to.
          - name: reimbursement_pct_of_charge
            description: Contracted reimbursement as a percentage of standard charge.
          - name: effective_date
            description: Date this contract rate became effective.
          - name: end_date
            description: Date this contract rate expires.
          - name: status
            description: Contract status (e.g., active, expired).

      - name: dim_payers
        description: Insurance payer reference data including denial behavior and payment performance metrics.
        columns:
          - name: payer_id
            description: Unique payer identifier (primary key).
            tests:
              - unique
              - not_null
          - name: payer_name
            description: Name of the payer/insurance company.
          - name: payer_type
            description: Payer classification (e.g., Commercial, Medicare, Medicaid, Self-Pay).
          - name: market_share
            description: Payer's share of the facility's claim volume.
          - name: denial_rate
            description: Historical denial rate for this payer.
          - name: avg_days_to_pay
            description: Average days from claim submission to payment.
          - name: pa_strictness
            description: Relative prior authorization strictness score for this payer.
          - name: policy_prefix
            description: Member ID prefix used to identify this payer on claims.
          - name: status
            description: Payer status (e.g., active, inactive).

      - name: dim_providers
        description: Provider-level data including NPI, specialty, department assignment, and quality scores.
        columns:
          - name: provider_id
            description: Unique provider identifier (primary key).
            tests:
              - unique
              - not_null
          - name: provider_name
            description: Full name of the provider.
          - name: npi
            description: National Provider Identifier (10-digit NPI number).
          - name: specialty
            description: Clinical specialty of the provider.
          - name: department_id
            description: Foreign key to dim_departments — provider's primary department.
          - name: coding_accuracy_score
            description: Score reflecting provider coding accuracy (0–100 scale).
          - name: documentation_completeness_score
            description: Score reflecting clinical documentation completeness (0–100 scale).
          - name: years_experience
            description: Number of years the provider has been in practice.
          - name: status
            description: Provider status (e.g., active, inactive, on leave).
          - name: credential
            description: Professional credential (e.g., MD, DO, NP, PA).

      # ---------------------------------------------------------------
      # FACT TABLES
      # ---------------------------------------------------------------

      - name: fact_claims
        description: >
          Core claims fact table. One row per claim submitted to a payer.
          Central table for RCM analytics — joins to all dimension and supplemental fact tables.
        columns:
          - name: claim_id
            description: Unique claim identifier (primary key).
            tests:
              - unique
              - not_null
          - name: patient_id
            description: Foreign key to dim_patients.
          - name: provider_id
            description: Foreign key to dim_providers — rendering provider.
          - name: payer_id
            description: Foreign key to dim_payers.
          - name: facility_id
            description: Foreign key to dim_facilities.
          - name: department_id
            description: Foreign key to dim_departments.
          - name: service_date
            description: Date the service was rendered.
          - name: submission_date
            description: Date the claim was submitted to the payer.
          - name: total_charge
            description: Total billed charge amount for the claim.
          - name: total_allowed
            description: Total allowed amount per payer contract.
          - name: total_paid
            description: Total amount paid by the payer.
          - name: patient_responsibility
            description: Amount the patient owes (copay, deductible, coinsurance).
          - name: status
            description: Current claim status (e.g., paid, denied, pending, appealed).
          - name: claim_type
            description: Claim form type (e.g., professional CMS-1500, institutional UB-04).
          - name: place_of_service
            description: CMS place of service code.
          - name: primary_icd10
            description: Primary ICD-10 diagnosis code on the claim.
          - name: days_in_ar
            description: Number of days the claim has been in accounts receivable.
          - name: is_clean_claim
            description: Flag indicating whether the claim was submitted without errors.
          - name: pa_required
            description: Flag indicating whether prior authorization was required.
          - name: pa_obtained
            description: Flag indicating whether prior authorization was obtained.
          - name: pa_number
            description: Prior authorization number assigned by the payer.

      - name: fact_denials
        description: >
          Claim denial events. One row per denial. Links back to fact_claims via claim_id.
          Core table for denial root cause analysis and prevention modeling.
        columns:
          - name: denial_id
            description: Unique denial identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: payer_id
            description: Foreign key to dim_payers — payer that issued the denial.
          - name: denial_date
            description: Date the denial was received.
          - name: root_cause_category
            description: High-level root cause category (e.g., coding error, missing auth, eligibility).
          - name: carc_code
            description: Claim Adjustment Reason Code — payer-issued denial reason code.
          - name: rarc_code
            description: Remittance Advice Remark Code — supplemental denial explanation.
          - name: denial_amount
            description: Dollar amount denied.
          - name: workflow_failure_point
            description: Step in the RCM workflow where the failure originated.
          - name: is_preventable
            description: Flag indicating whether the denial was preventable.
          - name: denial_reason_text
            description: Free-text description of the denial reason.
          - name: days_to_denial
            description: Days from claim submission to denial receipt.

      - name: fact_appeals
        description: Appeal records for denied claims. One row per appeal attempt.
        columns:
          - name: appeal_id
            description: Unique appeal identifier (primary key).
            tests:
              - unique
              - not_null
          - name: denial_id
            description: Foreign key to fact_denials.
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: appeal_date
            description: Date the appeal was submitted.
          - name: appeal_level
            description: Appeal tier (e.g., first-level, second-level, external review).
          - name: appeal_reason
            description: Stated reason for the appeal.
          - name: outcome
            description: Result of the appeal (e.g., overturned, upheld, partial).
          - name: overturn_amount
            description: Dollar amount recovered if appeal was overturned.
          - name: days_to_resolution
            description: Days from appeal submission to final decision.
          - name: submitted_by
            description: Role or person who submitted the appeal.

      - name: fact_charge_lag
        description: >
          Charge capture and submission timing data. Tracks lag between service delivery
          and charge entry, and between charge entry and claim submission.
        columns:
          - name: claim_id
            description: Foreign key to fact_claims (primary key in this table).
            tests:
              - unique
              - not_null
          - name: service_date
            description: Date the service was rendered.
          - name: charge_entry_date
            description: Date the charge was entered into the billing system.
          - name: submission_date
            description: Date the claim was submitted to the payer.
          - name: charge_lag_days
            description: Days between service date and charge entry date.
          - name: submission_lag_days
            description: Days between charge entry and claim submission.
          - name: total_lag_days
            description: Total days from service to submission.
          - name: charge_lag_bucket
            description: Categorized lag tier (e.g., 0-2 days, 3-5 days, 6+ days).
          - name: is_at_risk
            description: Flag indicating charge lag is approaching timely filing limits.
          - name: is_critical_lag
            description: Flag indicating charge lag has exceeded critical threshold.
          - name: entered_by_role
            description: Role of the staff member who entered the charge.

      - name: fact_claim_lines
        description: Line-level detail for each claim. One row per CPT code per claim.
        columns:
          - name: line_id
            description: Unique claim line identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: line_number
            description: Sequential line number within the claim.
          - name: cpt_code
            description: Foreign key to dim_cpt_codes — procedure billed on this line.
          - name: cpt_category
            description: CPT category for this procedure line.
          - name: modifier
            description: CPT modifier applied to this line (e.g., 25, 59, LT, RT).
          - name: units
            description: Units of service billed.
          - name: charge_amount
            description: Billed charge for this line item.
          - name: allowed_amount
            description: Contracted allowed amount for this line.
          - name: paid_amount
            description: Amount paid by the payer for this line.
          - name: icd10_pointer
            description: Pointer to the diagnosis code(s) supporting medical necessity for this line.

      - name: fact_claim_status_history
        description: >
          Claim status change history. One row per status event per claim.
          Used to track claim lifecycle from submission through adjudication.
        columns:
          - name: status_id
            description: Unique status event identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: status_date
            description: Date the status change occurred.
          - name: status_code
            description: Standardized status code (e.g., A1, A2, P4).
          - name: status_description
            description: Human-readable description of the status.
          - name: status_category
            description: High-level status category (e.g., accepted, rejected, pending).
          - name: clearinghouse_status
            description: Status returned by the clearinghouse at transmission.
          - name: days_since_submission
            description: Days elapsed from claim submission to this status event.

      - name: fact_encounters
        description: >
          Inpatient and outpatient encounter data linked to claims.
          Includes DRG, length of stay, and readmission flags for inpatient encounters.
        columns:
          - name: encounter_id
            description: Unique encounter identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: encounter_type
            description: Type of encounter (e.g., inpatient, outpatient, ED, observation).
          - name: admit_date
            description: Admission date (inpatient encounters only).
          - name: discharge_date
            description: Discharge date (inpatient encounters only).
          - name: length_of_stay
            description: Number of inpatient days.
          - name: admit_source
            description: Source of the admission (e.g., ER, physician referral, transfer).
          - name: discharge_disposition
            description: Disposition at discharge (e.g., home, SNF, expired).
          - name: severity_of_illness
            description: Clinical severity score.
          - name: risk_of_mortality
            description: Risk of mortality score.
          - name: drg_code
            description: Diagnosis Related Group code for inpatient MS-DRG assignment.
          - name: drg_weight
            description: Relative weight of the assigned DRG.
          - name: expected_los
            description: Geometric mean length of stay for the assigned DRG.
          - name: is_readmission_30day
            description: Flag indicating a 30-day readmission event.

      - name: fact_remittance
        description: >
          Remittance advice (ERA/835) data. One row per remittance transaction.
          Used to reconcile payments and identify underpayments.
        columns:
          - name: remittance_id
            description: Unique remittance record identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: payer_id
            description: Foreign key to dim_payers.
          - name: check_date
            description: Date payment was issued.
          - name: check_number
            description: EFT/check number for the payment.
          - name: total_charge
            description: Total billed charge on the remittance.
          - name: total_allowed
            description: Total allowed amount per contract.
          - name: total_paid
            description: Total amount paid by the payer.
          - name: adjustment_amount
            description: Total contractual adjustment applied.
          - name: adjudication_status
            description: Final adjudication result (e.g., paid, denied, partial).
          - name: carc_code
            description: Claim Adjustment Reason Code from the remittance.
          - name: rarc_code
            description: Remittance Advice Remark Code from the remittance.

      - name: fact_scheduling
        description: >
          Appointment scheduling data linked to claims. Tracks scheduling lead time,
          insurance verification, and no-show history — upstream of the RCM workflow.
        columns:
          - name: appointment_id
            description: Unique appointment identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: scheduled_date
            description: Date the appointment was scheduled.
          - name: appointment_date
            description: Actual date of the appointment.
          - name: appointment_type
            description: Type of appointment (e.g., new patient, follow-up, procedure).
          - name: scheduling_lead_days
            description: Days between scheduling date and appointment date.
          - name: appointment_status
            description: Final appointment status (e.g., completed, no-show, cancelled).
          - name: prior_no_show_count
            description: Number of prior no-shows for this patient.
          - name: check_in_minutes_early
            description: Minutes before appointment time the patient checked in.
          - name: insurance_verified_at_scheduling
            description: Flag indicating insurance eligibility was verified at scheduling.
          - name: referral_required
            description: Flag indicating a referral was required for this appointment.
          - name: referral_on_file
            description: Flag indicating the required referral was on file at appointment.
          - name: appointment_duration_minutes
            description: Scheduled duration of the appointment in minutes.

      - name: fact_workflow_events
        description: >
          RCM workflow step-level events per claim. One row per workflow step per claim.
          Used to identify bottlenecks across the 8-step billing and collections workflow.
        columns:
          - name: event_id
            description: Unique workflow event identifier (primary key).
            tests:
              - unique
              - not_null
          - name: claim_id
            description: Foreign key to fact_claims.
          - name: workflow_step
            description: Name of the workflow step (e.g., eligibility_check, coding_review, claim_submission).
          - name: step_order
            description: Sequential order of this step in the workflow.
          - name: event_timestamp
            description: Timestamp when this workflow event occurred.
          - name: status
            description: Outcome of this workflow step (e.g., passed, failed, skipped).
          - name: issues_flagged
            description: Description of any issues flagged at this step.
          - name: performed_by
            description: Role of the staff member who performed this step.
          - name: duration_minutes
            description: Time taken to complete this workflow step in minutes.

      # ---------------------------------------------------------------
      # REFERENCE TABLES
      # ---------------------------------------------------------------

      - name: ref_carc_codes
        description: >
          Claim Adjustment Reason Codes (CARC). Industry-standard codes used by payers
          on remittance advices to explain payment adjustments and denials.
        columns:
          - name: carc_code
            description: CARC code value (primary key).
            tests:
              - unique
              - not_null
          - name: description
            description: Full description of the adjustment reason.
          - name: group_code
            description: ANSI X12 group code (CO, PR, OA, PI) indicating who is responsible for the adjustment.

      - name: ref_rarc_codes
        description: >
          Remittance Advice Remark Codes (RARC). Supplemental codes used alongside CARC
          codes to provide additional explanation on remittance advices.
        columns:
          - name: rarc_code
            description: RARC code value (primary key).
            tests:
              - unique
              - not_null
          - name: description
            description: Full description of the remark.

      - name: ref_lcd_ncd_policies
        description: >
          Local Coverage Determinations (LCD) and National Coverage Determinations (NCD)
          from CMS. Used to validate medical necessity and coverage for procedures.
        columns:
          - name: policy_id
            description: Unique policy identifier (primary key).
            tests:
              - unique
              - not_null
          - name: policy_type
            description: Policy type — LCD (local) or NCD (national).
          - name: title
            description: Title of the coverage policy.
          - name: cpt_codes
            description: CPT codes governed by this policy.
          - name: covered_icd10
            description: ICD-10 codes that support coverage under this policy.
          - name: covered_conditions
            description: Clinical conditions covered under this policy.
          - name: non_covered_conditions
            description: Clinical conditions explicitly excluded from coverage.
          - name: documentation_required
            description: Documentation requirements for coverage determination.
          - name: mac_region
            description: Medicare Administrative Contractor (MAC) region for LCDs.

      - name: ref_mue_limits
        description: >
          Medically Unlikely Edit (MUE) limits from CMS. Maximum units of service per
          CPT code per day — used to flag potential overbilling.
        columns:
          - name: mue_id
            description: Unique MUE record identifier (primary key).
            tests:
              - unique
              - not_null
          - name: cpt_code
            description: CPT code this MUE applies to.
          - name: max_units_per_day
            description: Maximum allowed units of this service per date of service.
          - name: adjudication_type
            description: How the MUE is applied (line, date of service, or claim).
          - name: mue_rationale
            description: Clinical rationale for the MUE limit.
          - name: effective_date
            description: Date this MUE limit became effective.
          - name: source
            description: Source of the MUE (CMS, AMA, specialty society).

      - name: ref_ncci_ptp_edits
        description: >
          National Correct Coding Initiative (NCCI) Procedure-to-Procedure (PTP) edits.
          Defines CPT code pairs that cannot be billed together without an appropriate modifier.
        columns:
          - name: edit_id
            description: Unique edit identifier (primary key).
            tests:
              - unique
              - not_null
          - name: column_1_cpt
            description: Primary CPT code in the edit pair.
          - name: column_2_cpt
            description: Secondary CPT code that cannot be billed with column_1_cpt.
          - name: modifier_indicator
            description: Whether a modifier can bypass this edit (0=never, 1=allowed, 9=not applicable).
          - name: modifier_indicator_desc
            description: Description of the modifier indicator value.
          - name: effective_date
            description: Date this edit became effective.
          - name: termination_date
            description: Date this edit was terminated (null if still active).
          - name: rationale
            description: Clinical or coding rationale for the edit.
          - name: edit_type
            description: Type of edit (e.g., mutually exclusive, comprehensive/component).
          - name: source
            description: Source of the edit (CMS).

      - name: ref_nppes_providers
        description: >
          National Plan and Provider Enumeration System (NPPES) provider registry data.
          Used to validate NPI numbers, taxonomy codes, and enrollment status.
        columns:
          - name: provider_id
            description: Internal provider identifier linking to dim_providers.
          - name: npi
            description: National Provider Identifier (primary key).
            tests:
              - unique
              - not_null
          - name: entity_type
            description: NPI entity type — individual (Type 1) or organization (Type 2).
          - name: taxonomy_code
            description: Provider taxonomy code indicating specialty and provider type.
          - name: taxonomy_description
            description: Description of the taxonomy code.
          - name: license_state
            description: State where the provider is licensed.
          - name: license_number
            description: Provider license number.
          - name: enumeration_date
            description: Date the NPI was assigned.
          - name: last_update
            description: Date the NPPES record was last updated.
          - name: npi_status
            description: Current NPI status (active/deactivated).
          - name: sole_proprietor
            description: Flag indicating the provider is a sole proprietor.
          - name: organization_name
            description: Organization name (Type 2 NPIs only).
          - name: organization_npi
            description: Parent organization NPI (for individual providers in a group).
          - name: enrolled_payers
            description: List of payers the provider is enrolled with.
          - name: medicare_enrolled
            description: Flag indicating Medicare enrollment status.
          - name: medicaid_enrolled
            description: Flag indicating Medicaid enrollment status.
          - name: pecos_enrollment_date
            description: Date enrolled in the Provider Enrollment, Chain, and Ownership System (PECOS).
          - name: opt_out_status
            description: Medicare opt-out status for the provider.

      - name: ref_physician_fee_schedule
        description: >
          CMS Physician Fee Schedule (PFS) with RVU components and Medicare payment rates.
          Used to benchmark reimbursement and detect underpayments.
        columns:
          - name: cpt_code
            description: CPT procedure code.
          - name: description
            description: Procedure description.
          - name: category
            description: CPT category grouping.
          - name: work_rvu
            description: Work Relative Value Unit — physician effort component.
          - name: pe_rvu_facility
            description: Practice Expense RVU in a facility setting.
          - name: pe_rvu_nonfacility
            description: Practice Expense RVU in a non-facility (office) setting.
          - name: mp_rvu
            description: Malpractice RVU component.
          - name: total_rvu_facility
            description: Total RVU in a facility setting (work + PE + MP).
          - name: total_rvu_nonfacility
            description: Total RVU in a non-facility setting.
          - name: conversion_factor_2024
            description: Medicare conversion factor for 2024 ($/RVU).
          - name: conversion_factor_2025
            description: Medicare conversion factor for 2025 ($/RVU).
          - name: medicare_payment_facility_2024
            description: Medicare payment rate for facility setting in 2024.
          - name: medicare_payment_nonfacility_2024
            description: Medicare payment rate for non-facility setting in 2024.
          - name: medicare_payment_facility_2025
            description: Medicare payment rate for facility setting in 2025.
          - name: medicare_payment_nonfacility_2025
            description: Medicare payment rate for non-facility setting in 2025.
          - name: gpci_work
            description: Geographic Practice Cost Index — work component.
          - name: gpci_pe
            description: Geographic Practice Cost Index — practice expense component.
          - name: gpci_mp
            description: Geographic Practice Cost Index — malpractice component.
          - name: locality
            description: CMS payment locality code.
          - name: mac
            description: Medicare Administrative Contractor for this locality.
          - name: status_indicator
            description: Payment status indicator (e.g., A=active, B=bundled, N=non-covered).
